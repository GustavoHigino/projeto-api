name: Continuous integration Delivery and deployment with github action dotnet 10

on:
  push:
    branches: [ "section30" ]


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Create SQL Server Container
      run: |
        docker run -d --name sqlserver_test \
          -e "ACCEPT_EULA=Y" \
          -e "MSSQL_SA_PASSWORD=@Admin123" \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:2022-latest
        timeout 90s bash -c "until docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '@Admin123' -Q 'SELECT 1' -C; do sleep 5; done"
    - name: Create SQL Server Database
      run: docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '@Admin123' -Q "IF DB_ID('primeiro_projeto') IS NULL CREATE DATABASE [primeiro_projeto]" -C 
    - name: Checkout Repository 
      uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

